name: Validate n8n integration workflows

on:
  pull_request:
  push:
    branches:
      - "main"
      - "feature/insula-crm-integration"
  workflow_dispatch:

jobs:
  validate-workflows:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate integration workflow JSON, connections, and Code-node JavaScript
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const files = fs.readdirSync('workflows')
            .filter(name => /^(2[0-9]|30|31)-.*\.json$/.test(name))
            .map(name => path.join('workflows', name));

          const failures = [];

          for (const file of files) {
            let workflow;
            try {
              workflow = JSON.parse(fs.readFileSync(file, 'utf8'));
            } catch (err) {
              failures.push(`${file}: invalid JSON — ${err.message}`);
              continue;
            }

            const nodeIds = new Set((workflow.nodes || []).map(n => n.id));
            const nodeNames = new Set((workflow.nodes || []).map(n => n.name));

            for (const [from, outputGroups] of Object.entries(workflow.connections || {})) {
              if (!nodeIds.has(from) && !nodeNames.has(from)) {
                failures.push(`${file}: connection source "${from}" is not a declared node name or id`);
              }

              for (const groups of Object.values(outputGroups || {})) {
                for (const group of groups || []) {
                  for (const target of group || []) {
                    if (!nodeIds.has(target.node) && !nodeNames.has(target.node)) {
                      failures.push(`${file}: connection target "${target.node}" from "${from}" is not a declared node name or id`);
                    }
                  }
                }
              }
            }

            for (const node of workflow.nodes || []) {
              if (node.type !== 'n8n-nodes-base.code') continue;
              try {
                new Function(node.parameters?.jsCode || '');
              } catch (err) {
                failures.push(`${file}: Code node "${node.name}" has invalid JavaScript — ${err.message}`);
              }
            }
          }

          console.log(`Validated ${files.length} integration workflow JSON files.`);
          if (failures.length) {
            console.error(failures.join('\n'));
            process.exit(1);
          }
          console.log('All integration workflow JSON, connection targets, and Code-node JavaScript checks passed.');

          const fanin = JSON.parse(fs.readFileSync('workflows/30-property-candidate-fanin.json', 'utf8'));
          const faninNode = (fanin.nodes || []).find(n => n.name === 'Aggregate And Rank Candidates');
          if (!faninNode?.parameters?.jsCode) {
            throw new Error('WF-030 Aggregate And Rank Candidates Code node not found');
          }

          const fixture = JSON.parse(fs.readFileSync('tests/fixtures/property-candidate-fanin.json', 'utf8'));
          let fixtureResult;
          const input = { first: () => ({ json: fixture }) };
          try {
            fixtureResult = new Function('$input', faninNode.parameters.jsCode)(input);
          } catch (err) {
            throw new Error('WF-030 fan-in fixture execution failed: ' + err.message);
          }

          const fixtureOutput = fixtureResult?.[0]?.json;
          if (!fixtureOutput?.success) throw new Error('WF-030 fixture did not return success=true');
          if (fixtureOutput.candidate_count !== 1) throw new Error(`WF-030 fixture expected 1 deduped candidate, got ${fixtureOutput.candidate_count}`);
          const candidate = fixtureOutput.candidate_records?.[0];
          if (!candidate) throw new Error('WF-030 fixture returned no candidate');
          if (candidate.evidence_count !== 3) throw new Error(`WF-030 fixture expected 3 corroborating evidence records, got ${candidate.evidence_count}`);
          if (candidate.matched_criteria?.length !== 2) throw new Error(`WF-030 fixture expected 2 matched criteria, got ${candidate.matched_criteria?.length}`);
          if (candidate.evidence_status !== 'criterion_supported') throw new Error(`WF-030 fixture expected criterion_supported, got ${candidate.evidence_status}`);
          console.log('WF-030 deterministic fan-in fixture passed: dedupe, corroborating evidence, criterion matching, and support status are correct.');
          NODE
